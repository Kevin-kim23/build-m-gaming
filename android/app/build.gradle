import groovy.json.JsonSlurper

// The app version lives only in ../../package.json. versionName is that text and versionCode is
// derived from it, so the Play Store version and the in-game info screen can never drift apart.
// 0.32.0 -> 32000 (major * 1,000,000 + minor * 1,000 + patch); it always grows with the version.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version.toString()
def appVersionParts = appVersion.split('-')[0].tokenize('.').collect { it.toInteger() }
def appVersionCode = appVersionParts[0] * 1000000 + appVersionParts[1] * 1000 + appVersionParts[2]

apply plugin: 'com.android.application'
// Billing stays out of normal/release artifacts until product and policy approval.
def playBillingTest = providers.gradleProperty('playBillingTest').orNull == 'true'
def playBillingRelease = providers.gradleProperty('playBillingRelease').orNull == 'true'
def billingConfig = new Properties()
def billingFile = file('../play-billing.properties')
if ((playBillingTest || playBillingRelease) && billingFile.exists()) billingFile.withInputStream { billingConfig.load(it) }
if (playBillingRelease) {
    ['autoTapProductId', 'starterProductId', 'playLicensePublicKey'].each { name ->
        if (!billingConfig.getProperty(name, '').trim()) throw new GradleException('Missing local billing setting: ' + name)
    }
    if (billingConfig.getProperty('autoTapProductId') == billingConfig.getProperty('starterProductId'))
        throw new GradleException('Billing product IDs must be distinct.')
}
def billingString = { name -> groovy.json.JsonOutput.toJson(billingConfig.getProperty(name, '')) }


android {
    namespace = "com.dongramco.budaekiugi"
    compileSdk = rootProject.ext.compileSdkVersion
    // Closed-test build: both release and debug use Google sample inventory.
    // Restore publisher IDs and revalidate before production launch (docs/store/LIVE_ADS_072.md).
    buildFeatures { resValues true; buildConfig true }
    defaultConfig {
        buildConfigField 'boolean', 'PLAY_BILLING_ENABLED', 'false'
        buildConfigField 'String', 'PLAY_AUTO_TAP_PRODUCT', '""'
        buildConfigField 'String', 'PLAY_STARTER_PRODUCT', '""'
        buildConfigField 'String', 'PLAY_BILLING_KEY', '""'
        applicationId "com.dongramco.budaekiugi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
        resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'PLAY_BILLING_ENABLED', playBillingTest.toString()
            buildConfigField 'String', 'PLAY_AUTO_TAP_PRODUCT', billingString('autoTapProductId')
            buildConfigField 'String', 'PLAY_STARTER_PRODUCT', billingString('starterProductId')
            buildConfigField 'String', 'PLAY_BILLING_KEY', billingString('playLicensePublicKey')
            // Install beside the production app without replacing its saved game.
            applicationIdSuffix ".dev"
            resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
        }
        release {
            buildConfigField 'boolean', 'PLAY_BILLING_ENABLED', playBillingRelease.toString()
            buildConfigField 'String', 'PLAY_AUTO_TAP_PRODUCT', billingString('autoTapProductId')
            buildConfigField 'String', 'PLAY_STARTER_PRODUCT', billingString('starterProductId')
            buildConfigField 'String', 'PLAY_BILLING_KEY', billingString('playLicensePublicKey')
            resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        unsigned {
            // Explicit handoff artifact only: never substitutes for signed release.
            initWith release
            matchingFallbacks = ['release']
            signingConfig = null
        }
    }
}

if (playBillingTest) {
    android.sourceSets.debug.java.srcDir 'src/playBilling/java'
    android.sourceSets.test.java.srcDir 'src/playBillingTest/java'
    dependencies { debugImplementation 'com.android.billingclient:billing:8.3.0' }
}
if (playBillingRelease) {
    android.sourceSets.release.java.srcDir 'src/playBilling/java'
    dependencies { releaseImplementation 'com.android.billingclient:billing:8.3.0' }
}
apply from: 'release-signing.gradle'

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:25.5.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
apply from: 'notices.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
