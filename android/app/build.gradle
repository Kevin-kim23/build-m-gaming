import groovy.json.JsonSlurper

// The app version lives only in ../../package.json. versionName is that text and versionCode is
// derived from it, so the Play Store version and the in-game info screen can never drift apart.
// 0.32.0 -> 32000 (major * 1,000,000 + minor * 1,000 + patch); it always grows with the version.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version.toString()
def appVersionParts = appVersion.split('-')[0].tokenize('.').collect { it.toInteger() }
def appVersionCode = appVersionParts[0] * 1000000 + appVersionParts[1] * 1000 + appVersionParts[2]

apply plugin: 'com.android.application'

android {
    namespace = "com.dongramco.budaekiugi"
    compileSdk = rootProject.ext.compileSdkVersion
    // Closed-test build: both release and debug use Google sample inventory.
    // Restore publisher IDs and revalidate before production launch (docs/store/LIVE_ADS_072.md).
    buildFeatures { resValues true; buildConfig true }
    defaultConfig {
        applicationId "com.dongramco.budaekiugi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
        resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Install beside the production app without replacing its saved game.
            applicationIdSuffix ".dev"
            resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
        }
        release {
            resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        unsigned {
            // Explicit handoff artifact only: never substitutes for signed release.
            initWith release
            matchingFallbacks = ['release']
            signingConfig = null
        }
    }
}

apply from: 'release-signing.gradle'

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    debugImplementation project(':capacitor-firebase-authentication')
    implementation "com.google.android.gms:play-services-ads:25.5.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
apply from: 'notices.gradle'

// Public dev config stays out of the release resources and APK.
// Applying google-services globally would require a production config as well.
// Generate only the resources needed by the development login SDK.
def firebaseDevConfig = new JsonSlurper().parse(file('src/debug/google-services.json'))
def firebaseDevClient = firebaseDevConfig.client.find { it.client_info.android_client_info.package_name == 'com.dongramco.budaekiugi.dev' }
def firebaseDevWebClient = firebaseDevClient.oauth_client.find { it.client_type == 3 }
android.buildTypes.debug.resValue 'string', 'google_app_id', firebaseDevClient.client_info.mobilesdk_app_id
android.buildTypes.debug.resValue 'string', 'google_api_key', firebaseDevClient.api_key[0].current_key
android.buildTypes.debug.resValue 'string', 'project_id', firebaseDevConfig.project_info.project_id
android.buildTypes.debug.resValue 'string', 'default_web_client_id', firebaseDevWebClient.client_id

// Refuse accidental release packaging of a Firebase development web build.
tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'preUnsignedBuild']) {
        task.doFirst {
            if (file('src/main/assets/public/firebase-development-build.json').exists()) {
                throw new GradleException('Development Firebase assets cannot be released. Run npm run android:sync for a production build.')
            }
        }
    }
}
