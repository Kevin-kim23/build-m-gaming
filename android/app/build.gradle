import groovy.json.JsonSlurper

// The app version lives only in ../../package.json. versionName is that text and versionCode is
// derived from it, so the Play Store version and the in-game info screen can never drift apart.
// 0.32.0 -> 32000 (major * 1,000,000 + minor * 1,000 + patch); it always grows with the version.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version.toString()
def appVersionParts = appVersion.split('-')[0].tokenize('.').collect { it.toInteger() }
def appVersionCode = appVersionParts[0] * 1000000 + appVersionParts[1] * 1000 + appVersionParts[2]

apply plugin: 'com.android.application'

android {
    namespace = "com.dongramco.budaekiugi"
    compileSdk = rootProject.ext.compileSdkVersion
    // Closed-test build: both release and debug use Google sample inventory.
    // Restore publisher IDs and revalidate before production launch (docs/store/LIVE_ADS_072.md).
    buildFeatures { resValues true; buildConfig true }
    defaultConfig {
        applicationId "com.dongramco.budaekiugi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
        resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Install beside the production app without replacing its saved game.
            applicationIdSuffix ".dev"
            resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
        }
        release {
            resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "potion_rewarded_ad_unit", "ca-app-pub-3940256099942544/5224354917"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        unsigned {
            // Explicit handoff artifact only: never substitutes for signed release.
            initWith release
            matchingFallbacks = ['release']
            signingConfig = null
        }
    }
}

apply from: 'release-signing.gradle'

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation project(':capacitor-firebase-authentication')
    implementation "com.google.android.gms:play-services-ads:25.5.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
apply from: 'notices.gradle'

// Keep public Firebase resources scoped to each Android variant.
['debug': 'development', 'release': 'production', 'unsigned': 'production'].each { variant, environment ->
    def config = new JsonSlurper().parse(file(environment == 'development' ? 'src/debug/google-services.json' : 'src/release/google-services.json'))
    def expectedPackage = environment == 'development' ? 'com.dongramco.budaekiugi.dev' : 'com.dongramco.budaekiugi'
    def expectedProject = environment == 'development' ? 'budae-kiugi-dev' : 'budae-kiugi-prod'
    def client = config.client.find { it.client_info.android_client_info.package_name == expectedPackage }
    if (!client || config.project_info.project_id != expectedProject) throw new GradleException('Firebase native configuration mismatch: ' + variant)
    def webClient = client.oauth_client.find { it.client_type == 3 }
    if (!webClient) throw new GradleException('Firebase web OAuth client missing: ' + variant)
    android.buildTypes.getByName(variant).resValue 'string', 'google_app_id', client.client_info.mobilesdk_app_id
    android.buildTypes.getByName(variant).resValue 'string', 'google_api_key', client.api_key[0].current_key
    android.buildTypes.getByName(variant).resValue 'string', 'project_id', config.project_info.project_id
    android.buildTypes.getByName(variant).resValue 'string', 'default_web_client_id', webClient.client_id
}

// Reject stale/mixed web assets before any native variant can be packaged.
tasks.configureEach { task ->
    def environments = ['preDebugBuild': 'development', 'preReleaseBuild': 'production', 'preUnsignedBuild': 'production']
    if (environments.containsKey(task.name)) {
        task.doFirst {
            def environment = environments[task.name]
            def marker = file('src/main/assets/public/firebase-' + environment + '-build.json')
            def opposite = environment == 'production' ? 'development' : 'production'
            if (!marker.exists() || file('src/main/assets/public/firebase-' + opposite + '-build.json').exists()) {
                throw new GradleException('Firebase web/native environment mismatch. Sync the matching build first.')
            }
            def config = new JsonSlurper().parse(marker)
            def expectedProject = environment == 'development' ? 'budae-kiugi-dev' : 'budae-kiugi-prod'
            if (config.projectId != expectedProject || config.environment != environment || config.version != appVersion) {
                throw new GradleException('Firebase build marker mismatch: ' + environment)
            }
        }
    }
}
